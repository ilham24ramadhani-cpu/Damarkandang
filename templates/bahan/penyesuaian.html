{% extends 'cafe/base.html' %}
{% block title %}Penyesuaian Stok — Damarkandang{% endblock %}
{% block content %}
<div class="page-header"><h1>Penyesuaian Stok</h1><p class="text-muted">Sesuaikan stok sistem dengan stok fisik</p></div>
<div class="row justify-content-center"><div class="col-lg-6"><div class="card cafe-card"><div class="card-body">
  <form id="formPenyesuaian">
    <div class="mb-3"><label class="form-label">Bahan *</label><select id="idBahan" class="form-select" required></select></div>
    <div class="mb-3"><label class="form-label">Stok Sistem</label><input id="stokSistem" class="form-control" readonly /></div>
    <div class="mb-3"><label class="form-label">Stok Fisik (gram) *</label><input type="number" id="stokFisik" class="form-control" min="0" required /></div>
    <div class="mb-3"><label class="form-label">Selisih</label><input id="selisih" class="form-control" readonly /></div>
    <div class="mb-3"><label class="form-label">Alasan *</label><input id="alasan" class="form-control" required /></div>
    <div class="mb-3"><label class="form-label">Catatan</label><textarea id="catatan" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary w-100">Simpan Penyesuaian</button>
  </form>
</div></div></div></div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/cafe_penyesuaian.js') }}"></script>{% endblock %}
