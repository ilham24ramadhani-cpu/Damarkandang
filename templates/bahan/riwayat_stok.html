{% extends 'cafe/base.html' %}
{% block title %}Riwayat Stok — Damarkandang{% endblock %}
{% block content %}
<div class="page-header"><h1>Riwayat Perubahan Stok</h1></div>
<div class="card cafe-card"><div class="card-body">
  <div class="row g-2 mb-3">
    <div class="col-md-4"><select id="filterBahan" class="form-select"><option value="">Semua Bahan</option></select></div>

  </div>
  <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Tanggal</th><th>Bahan</th><th>Tipe</th><th>Jumlah</th><th>Sebelum</th><th>Sesudah</th><th>Keterangan</th></tr></thead><tbody id="tableBody"></tbody></table></div>
  <div id="pagination" class="d-flex justify-content-end"></div>
</div></div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/cafe_riwayat_stok.js') }}"></script>{% endblock %}
